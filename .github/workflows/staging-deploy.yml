# Coinexa STAGING deploy. Never touches main, production, coinexa.net DNS or Base44.
#
# Configuration lives ONLY in GitHub → Settings → Secrets and variables → Actions:
#   Non-secret settings: deploy/staging.env (project id, staging host) and the
#   repository variable OWNER_EMAIL.
#   Secrets:  SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, ANTHROPIC_API_KEY, RESEND_API_KEY,
#             STRIPE_SECRET_KEY (sk_test_ only), GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#             HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD
# Any step whose secrets are not set yet is skipped, so setup can happen in any order.
name: Staging deploy

on:
  workflow_dispatch:
  push:
    branches: [stage-2/build]
    paths-ignore: ['ops/**', 'docs/**']

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Secrets are exposed to steps as env so `if:` can test whether they are set.
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  # Cloudflare Turnstile (free CAPTCHA). The site key is public; the secret stays server-side.
  TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
  TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
  FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
  FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
  FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
  OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load staging settings (deploy/staging.env)
        run: |
          grep -E '^[A-Z_]+=' deploy/staging.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci
      - name: Shared code in sync
        run: node scripts/check-shared.mjs && node scripts/gen-columns.mjs --check
      - name: Ported functions match base44/ (only import lines and reviewed patches differ)
        run: node scripts/port-functions.mjs && git diff --exit-code -- supabase/functions
      - name: Unit tests (query translation, AI adapter, budget guard)
        working-directory: supabase/functions
        run: deno test --no-check --no-lock -A _tests/
      - name: Database policy tests (26 isolation checks on a throwaway Postgres)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "select 1" >/dev/null
          sudo bash supabase/tests/run_local.sh | tee /tmp/rls.txt
          grep -q "ALL RLS CHECKS PASSED" /tmp/rls.txt
      - name: Lint
        run: npm run lint
      - name: Secret scan (nothing that looks like a live key may be committed)
        run: |
          if git grep -nE "sk_live_[0-9A-Za-z]{10,}|sk-ant-[A-Za-z0-9_-]{20,}|re_[A-Za-z0-9]{20,}|service_role\"?\s*[:=]\s*\"ey" -- ':!*.md'; then
            echo "Possible secret committed"; exit 1; fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load staging settings (deploy/staging.env)
        run: |
          grep -E '^[A-Z_]+=' deploy/staging.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 3.3.0 }

      - name: Refuse live Stripe keys
        run: |
          case "$STRIPE_SECRET_KEY" in sk_live_*|rk_live_*) echo "Live Stripe key found. Staging accepts test keys only."; exit 1;; esac

      - name: Link project
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Database migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-all --yes

      - name: Auth settings (site URL, email codes, Google, SMTP)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.STAGING_HOST != '' }}
        run: |
          sed -i "s/__SITE_HOST__/${STAGING_HOST}/g" supabase/config.toml
          # Resend and Google are optional on staging: without them, Supabase's built-in
          # mailer sends sign-up codes (to project members only) and the Google button is off.
          if [ -z "$RESEND_API_KEY" ]; then
            sed -i '/^\[auth.email.smtp\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
            # Free plan: custom templates need custom SMTP, so drop them until Resend is added.
            python3 - <<'PY'
          import re
          p = 'supabase/config.toml'
          s = open(p).read()
          s = re.sub(r'^\[auth\.email\.template\.[a-z_]+\]\n(?:[^\[\n].*\n|\n)*', '', s, flags=re.M)
          open(p, 'w').write(s)
          PY
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            sed -i '/^\[auth.external.google\]/,/^\[/ s/^enabled = true/enabled = false/' supabase/config.toml
          fi
          # CAPTCHA only when both Turnstile keys exist (a site without the widget could not sign in).
          if [ -z "$TURNSTILE_SECRET_KEY" ] || [ -z "$TURNSTILE_SITE_KEY" ]; then
            sed -i '/^\[auth.captcha\]/,/^secret = /d' supabase/config.toml
            echo "CAPTCHA: off (Turnstile keys not set)"
          else
            echo "CAPTCHA: on (Turnstile)"
          fi
          supabase config push --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Function secrets
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: |
          f=$(mktemp)
          # Recruitment contact-data encryption key: created once, never replaced (replacing it
          # would make stored contact details unreadable). Lives only in Supabase secrets.
          # Same rule for the security-scan results key (SECURITY_DATA_KEY).
          NEW_DATA_KEY=""
          NEW_SCAN_KEY=""
          existing=$(supabase secrets list --remote="$SUPABASE_PROJECT_REF" -o json) || { echo "Could not list secrets; leaving the data keys alone" >&2; existing='"RECRUITMENT_DATA_KEY" "SECURITY_DATA_KEY"'; }
          if ! printf '%s' "$existing" | grep -q '"RECRUITMENT_DATA_KEY"'; then
            NEW_DATA_KEY=$(openssl rand -base64 32); echo "::add-mask::$NEW_DATA_KEY"
          fi
          if ! printf '%s' "$existing" | grep -q '"SECURITY_DATA_KEY"'; then
            NEW_SCAN_KEY=$(openssl rand -base64 32); echo "::add-mask::$NEW_SCAN_KEY"
          fi
          {
            echo "APP_ID=coinexa-staging"
            echo "AI_MODEL=claude-sonnet-5-5"
            echo "AI_MONTHLY_BUDGET_USD=18"
            [ -n "$STAGING_HOST" ] && echo "APP_URL=https://${STAGING_HOST}" && echo "ALLOWED_ORIGINS=https://${STAGING_HOST},http://localhost:5173"
            [ -n "$OWNER_EMAIL" ] && echo "EMAIL_REDIRECT_TO=${OWNER_EMAIL}"
            # Sender address: set EMAIL_FROM in deploy/staging.env ONLY after the email-domain
            # workflow reports "verified" and "test email delivered". Staging keeps redirecting
            # every email to the owner regardless; real customer emails are a production setting.
            [ -n "$EMAIL_FROM" ] && echo "EMAIL_FROM=${EMAIL_FROM}"
            [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            [ -n "$RESEND_API_KEY" ] && echo "RESEND_API_KEY=${RESEND_API_KEY}"
            [ -n "$TURNSTILE_SECRET_KEY" ] && [ -n "$TURNSTILE_SITE_KEY" ] && echo "TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}"
            [ -n "$STRIPE_SECRET_KEY" ] && echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}"
            [ -n "$NEW_DATA_KEY" ] && echo "RECRUITMENT_DATA_KEY=${NEW_DATA_KEY}"
            [ -n "$NEW_SCAN_KEY" ] && echo "SECURITY_DATA_KEY=${NEW_SCAN_KEY}"
            true
          } > "$f"
          supabase secrets set --remote="$SUPABASE_PROJECT_REF" --yes --env-file "$f"
          rm -f "$f"

      - name: Deploy functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --jobs 4 --yes

      - name: Build website
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: |
          npm ci
          ANON=$(supabase projects api-keys --remote="$SUPABASE_PROJECT_REF" -o json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const k=JSON.parse(s);const a=k.find(x=>x.name==='anon')||k.find(x=>x.type==='publishable');process.stdout.write(a.api_key)})")
          echo "::add-mask::$ANON"
          VITE_SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" VITE_SUPABASE_ANON_KEY="$ANON" VITE_APP_ID=coinexa-staging VITE_TURNSTILE_SITE_KEY="$([ -n "$TURNSTILE_SECRET_KEY" ] && echo "$TURNSTILE_SITE_KEY")" npm run build
          # The bundle must never contain a server-side secret.
          ! grep -rqE "service_role|sk_test_|sk_live_|sk-ant-|re_[A-Za-z0-9]{20,}" dist/

      - name: Upload to Hostinger (staging site only)
        # Host and user are not secret and live in deploy/staging.env; a GitHub secret wins if set.
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.STAGING_HOST != '' && env.FTP_PASSWORD != '' && (env.FTP_HOST != '' || env.HOSTINGER_FTP_HOST != '') }}
        run: |
          FTP_HOST="${FTP_HOST:-$HOSTINGER_FTP_HOST}"; FTP_USER="${FTP_USER:-$HOSTINGER_FTP_USER}"
          FTP_HOST="${FTP_HOST#ftp://}"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; mirror -R --delete --verbose=1 --exclude-glob .well-known --exclude-glob public_html/ --exclude-glob downloads/ dist/ \"${HOSTINGER_FTP_DIR:-.}\"; bye"
          # One-off tidy-up: an earlier upload went into a nested public_html/ by mistake.
          # Only removed when this FTP account's root is itself the web root (index.html just uploaded there).
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; set cmd:fail-exit yes; cls -1 index.html; rm -r public_html; bye" && echo "removed nested public_html" || echo "no nested public_html"
