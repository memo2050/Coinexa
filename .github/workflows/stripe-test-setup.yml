# Stripe TEST-MODE setup for staging. Refuses any live key.
# Creates (once) the two plans with lookup keys, and a webhook endpoint pointing at
# the staging stripeWebhook function; stores the price ids and the webhook signing
# secret as Supabase function secrets. Nothing is charged; no live mode is touched.
name: Stripe test setup (staging)

on:
  # A workflow on a non-default branch cannot be started from the Actions tab, and
  # main must not change. So this runs when ops/stripe-test-setup.request is committed to the
  # stage-2 branch (only done after the owner's approval in chat).
  push:
    branches: [stage-2/build]
    paths: ['ops/stripe-test-setup.request']
  workflow_dispatch:
    inputs:
      recreate_webhook:
        description: Recreate the staging webhook endpoint (rotates its secret)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stripe:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RECREATE: ${{ inputs.recreate_webhook || 'false' }}
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Test key only
        run: |
          case "$STRIPE_SECRET_KEY" in sk_test_*|rk_test_*) ;; *) echo "A Stripe TEST key (sk_test_...) is required."; exit 1;; esac
      - name: Plans, webhook and function secrets
        run: |
          node --input-type=module -e '
            const key = process.env.STRIPE_SECRET_KEY;
            const api = async (method, path, params) => {
              const body = params ? new URLSearchParams(params) : undefined;
              const r = await fetch(`https://api.stripe.com/v1${path}`, { method, headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/x-www-form-urlencoded" }, body });
              const j = await r.json(); if (!r.ok) throw new Error(`${path}: ${j.error?.message}`); return j;
            };
            const plans = [
              { lookup: "coinexa_agent_sprint", name: "Agent Sprint", amount: 2500, env: "STRIPE_PRICE_AGENT_SPRINT" },
              { lookup: "coinexa_studio_retainer", name: "Studio Retainer", amount: 5000, env: "STRIPE_PRICE_STUDIO_RETAINER" },
            ];
            const out = [];
            for (const p of plans) {
              const found = await api("GET", `/prices?lookup_keys[]=${p.lookup}&active=true`);
              let price = found.data[0];
              if (!price) {
                const product = await api("POST", "/products", { name: `Coinexa ${p.name}` });
                price = await api("POST", "/prices", { product: product.id, unit_amount: String(p.amount), currency: "usd", "recurring[interval]": "month", lookup_key: p.lookup });
                console.log(`created test price ${p.lookup}`);
              }
              if (price.livemode) throw new Error("Live-mode price returned; aborting.");
              out.push(`${p.env}=${price.id}`);
            }
            const url = `https://${process.env.PROJECT_REF}.supabase.co/functions/v1/stripeWebhook`;
            const hooks = await api("GET", "/webhook_endpoints?limit=100");
            const existing = hooks.data.filter((h) => h.url === url);
            if (existing.length && process.env.RECREATE !== "true") {
              console.log("Webhook endpoint already exists; secret unchanged. Re-run with recreate_webhook to rotate it.");
            } else {
              for (const h of existing) await api("DELETE", `/webhook_endpoints/${h.id}`);
              const events = ["checkout.session.completed", "checkout.session.async_payment_succeeded", "customer.subscription.updated", "customer.subscription.deleted"];
              const params = new URLSearchParams({ url, description: "Coinexa staging" });
              events.forEach((e) => params.append("enabled_events[]", e));
              const r = await fetch("https://api.stripe.com/v1/webhook_endpoints", { method: "POST", headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/x-www-form-urlencoded" }, body: params });
              const hook = await r.json(); if (!r.ok) throw new Error(hook.error?.message);
              if (hook.livemode) throw new Error("Live-mode webhook; aborting.");
              out.push(`STRIPE_WEBHOOK_SECRET=${hook.secret}`);
              console.log("created test webhook endpoint");
            }
            (await import("node:fs")).writeFileSync("/tmp/stripe.env", out.join("\n") + "\n");
          '
          supabase secrets set --project-ref "$PROJECT_REF" --env-file /tmp/stripe.env
          rm -f /tmp/stripe.env
