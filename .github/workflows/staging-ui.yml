name: Staging browser check

# Runs when ops/ui.request changes on stage-2/build. Builds the site, serves it on
# the runner against the staging backend, and visits every page on desktop and
# mobile as a visitor, a user and an admin. No AI calls are made.
# Screenshots go to the orphan branch ci/ui-shots (replaced on every run).
on:
  push:
    branches: [stage-2/build]
    paths: [ops/ui.request]

permissions:
  contents: write

concurrency: { group: staging-ui, cancel-in-progress: true }

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Load staging settings
        run: grep -E '^[A-Z_]+=' deploy/staging.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with: { version: 3.3.0 }
      - name: Project keys (masked)
        run: |
          supabase projects api-keys --remote="$SUPABASE_PROJECT_REF" --reveal -o json > /tmp/keys.json
          node -e '
            const k = JSON.parse(require("fs").readFileSync("/tmp/keys.json","utf8"));
            const pick = (...names) => (k.find((x) => names.includes(x.name)) || k.find((x) => names.includes(x.type)) || {}).api_key;
            const anon = pick("anon", "publishable"), service = pick("service_role", "secret");
            if (!anon || !service) { console.error("keys not found"); process.exit(1); }
            console.log("::add-mask::" + service);
            require("fs").appendFileSync(process.env.GITHUB_ENV, `SUPABASE_ANON_KEY=${anon}\nSUPABASE_SERVICE_KEY=${service}\n`);
          '
          rm -f /tmp/keys.json
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
      - name: Build site against staging
        run: VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" VITE_APP_ID=coinexa-staging npm run build
      - name: Browser
        run: npm i --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - name: Visit every page
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:4173 node scripts/ui-staging.mjs
      - name: Publish screenshots to ci/ui-shots
        if: always()
        run: |
          [ -d ui-shots ] || exit 0
          cd ui-shots
          git init -q -b ci/ui-shots
          git config user.name "coinexa-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "UI screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci/ui-shots
