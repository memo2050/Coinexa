name: Network scanner diagnosis (staging, read-only)

# Prints statuses, counts and times only (the repository is public: no personal data).
on:
  push:
    branches: [stage-2/build]
    paths: [ops/diagnose.request]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Load staging settings
        run: grep -E '^[A-Z_]+=' deploy/staging.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with: { version: 3.3.0 }
      - name: Project keys (masked)
        run: |
          supabase projects api-keys --remote="$SUPABASE_PROJECT_REF" --reveal -o json > /tmp/keys.json
          node -e '
            const fs = require("fs"); const k = JSON.parse(fs.readFileSync("/tmp/keys.json","utf8"));
            const s = (k.find((x) => ["service_role","secret"].includes(x.name)) || k.find((x) => ["service_role","secret"].includes(x.type)) || {}).api_key;
            if (!s) process.exit(1);
            console.log("::add-mask::" + s);
            fs.appendFileSync(process.env.GITHUB_ENV, `SUPABASE_SERVICE_KEY=${s}\nSUPABASE_URL=https://${process.env.SUPABASE_PROJECT_REF}.supabase.co\n`);
          '
          rm -f /tmp/keys.json
      - name: Database state
        env:
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: node scripts/scanner-diagnose.mjs
      - name: securityScan requests and refusals (last 12 h)
        run: node scripts/scanner-logs.mjs
